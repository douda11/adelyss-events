[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/frontend/browser"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/mail-relay"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://adelyss-events-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://adelyss-events-api.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

